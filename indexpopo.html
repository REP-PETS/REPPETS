body{background:var(--bg);color:var(--fg);font:16px/1.55 var(--body);margin:0}
a{color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.08;letter-spacing:-.01em;text-wrap:balance;margin:0}
h1{font-size:clamp(2.4rem,6vw,4.2rem)}
h2{font-size:clamp(1.9rem,4vw,2.7rem)}
h3{font-size:1.35rem}
p{margin:0}
.wrap{max-width:1120px;margin:0 auto;padding-inline:20px}
.eyebrow{font:600 .74rem/1 var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.sec-head .eyebrow,.hero .eyebrow{align-self:flex-start;background:var(--leaf);color:var(--pill-ink);padding:.45rem .7rem;border-radius:6px}
.lead{font-size:1.08rem;color:var(--muted);max-width:60ch}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gecko);outline-offset:2px;border-radius:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;border:0;border-radius:999px;padding:.78rem 1.25rem;font-weight:600;cursor:pointer;text-decoration:none;transition:transform .15s ease, background .15s ease}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--gecko);color:var(--gecko-ink)}
.btn-dark{background:var(--moss);color:var(--moss-ink)}
.btn-ghost{background:transparent;border:1.5px solid var(--line);color:var(--fg)}
.btn-ghost:hover{border-color:var(--fg)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:.35rem;font:600 .72rem/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:.42rem .62rem;border-radius:999px;background:var(--sunk);color:var(--muted)}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--glass);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:1rem;height:62px}
.brand{display:flex;align-items:center;gap:.55rem;text-decoration:none;flex:none}
.brand b{font:700 1.5rem/1 var(--display);color:var(--brand)}
.brand .logo{width:38px}
nav.links{display:flex;gap:.2rem;overflow-x:auto;scrollbar-width:none;min-width:0;flex:1}
nav.links::-webkit-scrollbar{display:none}
nav.links a{white-space:nowrap;text-decoration:none;font-weight:500;font-size:.93rem;padding:.45rem .7rem;border-radius:999px;color:var(--muted)}
nav.links a:hover{color:var(--fg);background:var(--sunk)}
#adminBtn{flex:none;padding:.5rem .9rem;font-size:.85rem}
@media (max-width:720px){.top .wrap{height:auto;flex-wrap:wrap;padding-block:10px;gap:.4rem}nav.links{order:3;flex-basis:100%}}

/* hero */
.hero{padding-block:56px 40px}
.hero .wrap{display:grid;grid-template-columns:1.05fr .95fr;gap:40px;align-items:center}
.hero .copy{display:flex;flex-direction:column;gap:20px;min-width:0}
.hero h1 em{font-style:normal;color:var(--leaf)}
.hero .ctas{display:flex;flex-wrap:wrap;gap:10px}
.hero-art{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:18px;min-width:0}
.hero-art svg{display:block;width:100%;height:auto}
.hero-art figcaption{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:12px;font:400 .78rem/1.3 var(--mono);color:var(--muted)}
@media (max-width:820px){.hero .wrap{grid-template-columns:1fr}.hero{padding-block:32px 24px}}

.trust{background:var(--moss);color:var(--moss-ink)}
.trust .wrap{display:grid;grid-template-columns:repeat(3,1fr);gap:0}
.trust div{padding:18px 20px;display:flex;flex-direction:column;gap:4px;border-left:1px solid var(--trust-line)}
.trust div:first-child{border-left:0}
.trust strong{font-weight:600}
.trust span{font:400 .8rem/1.35 var(--mono);opacity:.8}
@media (max-width:720px){.trust .wrap{grid-template-columns:1fr}.trust div{border-left:0;border-top:1px solid var(--trust-line)}.trust div:first-child{border-top:0}}

section.block{padding-block:72px}
.sec-head{display:flex;flex-direction:column;gap:12px;margin-bottom:32px}
.alt{background:var(--surface);border-block:1px solid var(--line)}

/* stock */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.filters button{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:.45rem .95rem;cursor:pointer;font-weight:500}
.filters button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.alt .card{background:var(--bg)}
.card .ph{aspect-ratio:4/3;background:var(--sunk);position:relative;max-width:100%}
.card .ph img,.card .ph svg{width:100%;height:100%;object-fit:cover;display:block}
.card .ph .chip{position:absolute;top:10px;left:10px;background:var(--surface);color:var(--fg)}
.card .body{padding:16px;display:flex;flex-direction:column;gap:8px;flex:1}
.card .meta{font:400 .8rem/1.4 var(--mono);color:var(--muted)}
.card .row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:auto;padding-top:8px}
.price{font:600 1.05rem/1 var(--mono);font-variant-numeric:tabular-nums}
.state{font:600 .7rem/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:.38rem .55rem;border-radius:999px;display:inline-flex;align-items:center;gap:.35rem}
.state::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st-disponible{color:var(--ok);background:rgba(47,122,70,.14)}
.st-apartado{color:var(--warn);background:rgba(168,106,18,.16)}
.st-vendido{color:var(--muted);background:var(--sunk)}
.card.sold .ph{filter:grayscale(.85);opacity:.7}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:36px 24px;display:flex;flex-direction:column;align-items:flex-start;gap:14px;max-width:640px}

/* guides */
.tabgroups{display:flex;flex-direction:column;gap:14px;margin-bottom:14px}
.tg{display:flex;flex-direction:column;gap:6px}
.tgl{font:600 .72rem/1 var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{border:0;background:var(--sunk);border-radius:12px;padding:.7rem 1rem;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
.tabs button small{font:400 .76rem/1.25 var(--body);color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--moss);color:var(--moss-ink)}
.tabs button[aria-selected="true"] small{color:inherit;opacity:.8}
.guide{display:grid;grid-template-columns:320px 1fr;gap:28px;align-items:start}
.guide>*{min-width:0}
@media (max-width:860px){.guide{grid-template-columns:1fr}}
.tag{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:14px;position:sticky;top:90px}
@media (max-width:860px){.tag{position:static}}
.tagpic{border-radius:10px;overflow:hidden;background:var(--sunk)}
.tagpic svg{display:block;width:100%;height:auto}
.tag .sci{font:italic 400 .85rem/1.2 var(--mono);color:var(--muted)}
.tag dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:.92rem}
.tag dt{font:600 .7rem/1.6 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tag dd{margin:0;font-variant-numeric:tabular-nums}
.gauge{display:flex;flex-direction:column;gap:8px}
.gauge .lbl{display:flex;justify-content:space-between;font:600 .7rem/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.bar{position:relative;height:34px;border-radius:8px;background:var(--sunk);overflow:visible}
.bar.temp{background:linear-gradient(90deg,#5B8FB9 0%,#7FB3A0 30%,#E7C35A 60%,#E0762F 82%,#B8322A 100%)}
.bar.hum{background:linear-gradient(90deg,#E6CFA0 0%,#A9C7B8 50%,#4F87A8 100%)}
.bar .band{position:absolute;top:0;bottom:0;border:2px solid var(--fg);border-radius:6px;background:rgba(255,255,255,.22)}
.bar .mark{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--bad)}
.ticks{position:relative;height:16px;font:400 .68rem/1 var(--mono);color:var(--muted)}
.ticks span{position:absolute;transform:translateX(-50%)}
.keys{display:flex;flex-direction:column;gap:4px;font-size:.84rem;color:var(--muted)}
.keys b{color:var(--fg);font:600 .82rem/1.3 var(--mono)}
.gcards{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}

  grandis:{"alias":"Gecko diurno gigante, gecko verde de Madagascar, felsuma","nombre":"Gecko diurno gigante de Madagascar","sci":"Phelsuma grandis","lead":"Un gecko verde brillante que vive de día y trepa a lo alto. Es para verlo, no para cargarlo: su piel es muy delicada.","ficha":[["Tamaño","23 a 28 cm"],["Vida","15 a 20 años"],["Actividad","De día"],["Terrario","Mínimo 60 × 60 cm de base y 120 cm de alto (o base de 90 × 45 cm con 120 cm de alto)"],["Nivel","Intermedio"]],"temp":{"bands":[[25,28,"Lado fresco"],[29,32,"Zona de asoleo (superficie)"]],"note":"La zona de asoleo se mide en la superficie donde se asolea (sonda pegada a la rama). De noche debe estar a 23–25 °C. El calor siempre va con termostato o regulador (dimmer). Ojo: la zona de asoleo es la temperatura de la superficie bajo el foco, medida con termómetro infrarrojo (pistola); el aire debe estar más fresco y siempre debe haber zonas frescas."},"hum":{"bands":[[40,75,"Promedio"]],"note":"Rocía el terrario cada mañana y cada tarde: así también toma agua. Mide la humedad a media altura con un higrómetro digital de sonda."},"cards":[["Alimentación",["Come insectos y también fruta: en la naturaleza toma néctar de flores y jugo de fruta.","Papilla de fruta comercial tipo crested gecko diet (Pangea, Repashy, Zoo Med u otras); rota al menos 3 sabores.","Insectos vivos: grillos, cucarachas dubia o discoides, langostas, gusanos de seda o hornworms.","Espolvorea los insectos con calcio en cada comida; la papilla ya viene fortificada y no necesita calcio extra."]],["Terrario y sustrato",["Vertical: le importa la altura, no el piso.","Ramas, bambú y plantas vivas para trepar, asolearse y esconderse.","Sustrato de tierra tipo selva (tierra, fibra de coco) con hojas secas encima.","Un solo macho por terrario: los machos pelean."]],["Luz y calor",["13 horas de luz en verano y 11 en invierno; cambia poco a poco.","UVB obligatoria: tubo T5 HO 5.0 o Arcadia 6 % (índice UV 3 a 4 en la zona de asoleo).","Calor desde arriba con focos incandescentes y regulador.","Cambia el tubo UVB cada 12 meses aunque siga prendiendo."]],["Manejo",["Es para observar: su piel se rompe con facilidad si lo agarras.","Espera al menos 2 semanas a que se adapte antes de interactuar.","Puedes darle insectos con pinzas suaves o dejar que lama papilla de tu dedo.","Nunca lo agarres ni lo jales de la cola."]]],"alertas":["Mandíbula blanda, columna chueca o temblores: puede ser enfermedad ósea metabólica (falta de calcio).","Piel de muda pegada en dedos o cola.","No come, adelgaza o está aletargado.","Heridas, piel desgarrada o cambios de color en la piel."],"rutina":{"Diario":["Revisa temperatura","Rocía mañana y tarde","Retira heces y uratos"],"Semanal":["Insectos y papilla según su etapa","Lava el bebedero con desinfectante veterinario","Calcio en cada comida de insectos"],"Mensual":["Limpia vidrios","Revisa focos, UVB y termostato","Poda plantas"]},"local":["Legalidad en México","Todas las Phelsuma están en el Apéndice II de CITES. Cómpralo solo en UMA o PIMVS con documentos que acrediten su origen legal, y nunca lo liberes."]},
  standingi:{"alias":"Gecko de Standing, gecko diurno de Standing, felsuma","nombre":"Gecko diurno de Standing","sci":"Phelsuma standingi","lead":"Un gecko diurno grande de tonos verde-gris con bandas. Vive en lo alto del terrario y se disfruta mirándolo.","ficha":[["Tamaño","20 a 25 cm"],["Vida","15 a 20 años"],["Actividad","De día"],["Terrario","Mínimo 60 × 60 cm de base y 120 cm de alto (o base de 90 × 45 cm con 120 cm de alto)"],["Nivel","Intermedio"]],"temp":{"bands":[[24,31,"Lado fresco"],[32,35,"Zona de asoleo"]],"note":"De noche debe bajar a 22–23 °C. El calor siempre va con termostato o regulador (dimmer)."},"hum":{"bands":[[40,75,"Promedio"]],"note":"Rocía el terrario cada mañana y cada tarde. Mide la humedad a media altura con un higrómetro digital de sonda."},"cards":[["Alimentación",["Come insectos y también fruta: papilla comercial tipo crested gecko diet (Pangea, Repashy); rota al menos 3 sabores.","Insectos vivos: grillos, cucarachas dubia, discoides o red runner, langostas, gusanos de seda, hornworms o larvas de mosca soldado.","Alimenta a los insectos con buena comida 2 a 3 días antes de dárselos.","Calcio en los insectos en cada comida; la papilla ya viene fortificada."]],["Terrario y sustrato",["Vertical, con ramas, bambú y plantas para trepar.","Sustrato de tierra tipo selva con hojas secas encima.","Bebedero con agua limpia siempre."]],["Luz y calor",["13 horas de luz en verano y 11 en invierno; cambia poco a poco.","UVB obligatoria: tubo T5 HO 5.0 o Arcadia 6 % (índice UV 3 a 4 en la zona de asoleo).","Calor con dos focos incandescentes y regulador.","Cambia el tubo UVB cada 12 meses."]],["Manejo",["Es para observar: no lo agarres, su piel es delicada.","Espera al menos 2 semanas antes de interactuar.","Puedes darle insectos con pinzas o papilla en tu dedo."]]],"alertas":["Mandíbula blanda, columna chueca o temblores: puede ser enfermedad ósea metabólica (falta de calcio).","Piel de muda pegada en dedos o cola.","No come, adelgaza o está aletargado.","Heridas, piel desgarrada o cambios de color en la piel."],"rutina":{"Diario":["Revisa temperatura","Rocía mañana y tarde","Retira heces y uratos"],"Semanal":["Insectos y papilla según su etapa","Lava el bebedero con desinfectante veterinario","Calcio en cada comida de insectos"],"Mensual":["Limpia vidrios","Revisa focos, UVB y termostato","Poda plantas"]},"local":["Legalidad en México","Todas las Phelsuma están en el Apéndice II de CITES. Cómpralo solo en UMA o PIMVS con documentos que acrediten su origen legal, y nunca lo liberes."]},
  laticauda:{"alias":"Gecko polvo de oro, gecko diurno cola plana, felsuma dorado","nombre":"Gecko diurno polvo de oro","sci":"Phelsuma laticauda","lead":"Pequeño, verde con motas doradas y manchas rojas. Es rápido y delicado: un gecko para ver, no para cargar.","ficha":[["Tamaño","10 a 13 cm"],["Vida","Hasta 15 años"],["Actividad","De día"],["Terrario","Base de 30 × 30 cm, 45 cm de alto (mínimo)"],["Nivel","Intermedio"]],"temp":{"bands":[[28,32,"Ambiente de día"],[32,32,"Zona de asoleo"]],"note":"De noche puede bajar a 21–25 °C. Para empezar basta un foco incandescente de 25 W con regulador; cuelga las lámparas sobre un soporte para que no se queme trepando por la malla."},"hum":{"bands":[[40,70,"Promedio"]],"note":"Rocía el terrario cada mañana, y en la tarde si hace falta. Mide a media altura con higrómetro digital."},"cards":[["Alimentación",["Come insectos y también fruta: papilla tipo crested gecko diet (Pangea, Repashy, Zoo Med u otras); rota al menos 3 sabores.","Insectos pequeños: grillos, cucarachas red head, langostas chicas, moscas de la fruta sin alas, hornworms chicos o gusanos de seda.","Calcio en los insectos en cada comida; la papilla ya viene fortificada.","Bebedero con agua limpia siempre."]],["Terrario y sustrato",["Vertical, con plantas y ramas para trepar.","Sustrato de tierra con hojas secas encima.","Se puede tener en grupo: un macho con varias hembras o solo hembras, con terrario más grande."]],["Luz y calor",["13 horas de luz en verano y 11 en invierno.","UVB obligatoria: espiral o tubo 5.0 a 5–10 cm, o Arcadia ShadeDweller (índice UV 3 a 4 en el asoleo).","Cambia el UVB cada 6 a 12 meses.","Luz blanca brillante (LED de 6500 K) en al menos la mitad del techo."]],["Manejo",["No se recomienda cargarlo: es chico, rápido y frágil.","Espera al menos 2 semanas antes de interactuar.","Puedes darle insectos con pinzas suaves o papilla en tu dedo."]]],"alertas":["Mandíbula blanda, columna chueca o temblores: puede ser enfermedad ósea metabólica (falta de calcio).","Piel de muda pegada en dedos o cola.","No come, adelgaza o está aletargado.","Quemaduras en la panza o patas por trepar cerca del foco."],"rutina":{"Diario":["Revisa temperatura","Rocía en la mañana","Retira heces y uratos"],"Semanal":["Insectos y papilla según su etapa","Lava el bebedero con desinfectante veterinario","Calcio en cada comida de insectos"],"Mensual":["Limpia vidrios","Revisa focos, UVB y termostato","Poda plantas"]},"local":["Legalidad en México","Todas las Phelsuma están en el Apéndice II de CITES. Cómpralo solo en UMA o PIMVS con documentos que acrediten su origen legal, y nunca lo liberes."]},
  tokay:{"alias":"Tokay, gecko tokay, toqué","nombre":"Gecko tokay","sci":"Gekko gecko","lead":"Grande, azul con manchas naranjas y muy ruidoso. Es nocturno, territorial y muerde fuerte: para quien ya tiene experiencia.","ficha":[["Tamaño","25 a 30 cm (hasta 40 cm)"],["Vida","15 a 20 años"],["Actividad","De noche"],["Terrario","Mínimo 60 × 60 cm de base y 120 cm de alto; si mide más de 30 cm, 90 × 60 × 120 cm"],["Nivel","Avanzado"]],"temp":{"bands":[[26,29,"Lado fresco"],[32,38,"Zona de asoleo (superficie)"]],"note":"La zona de asoleo se mide en la superficie de la rama, que debe quedar al menos a 15 cm del foco. De noche: 24–26 °C. El calor siempre va con termostato o regulador. Ojo: la zona de asoleo es la temperatura de la superficie bajo el foco, medida con termómetro infrarrojo (pistola); el aire debe estar más fresco y siempre debe haber zonas frescas."},"hum":{"bands":[[60,80,"Promedio"]],"note":"Rocía cada noche (y en la mañana si hace falta): así toma agua. Necesita buena ventilación para evitar hongos e infecciones."},"cards":[["Alimentación",["Solo insectos vivos: grillos, cucarachas dubia, discoides o red runner, langostas, hornworms o gusanos de seda.","Presas no más grandes que su cabeza.","De premio, máximo 2 veces al mes: papilla tipo crested gecko diet o un ratón bebé (pinky).","Alimenta a los insectos con buena comida 2 a 3 días antes y espolvoréalos con calcio en cada comida."]],["Terrario y sustrato",["Vertical, con ramas, corteza y plantas para trepar y esconderse.","Uno solo por terrario: es territorial.","Bebedero en una repisa magnética, en lo alto."]],["Luz y calor",["12 horas de luz al día.","UVB tipo T8 5.0 o Arcadia ShadeDweller (índice UV 1 a 2 en la zona de asoleo).","Calor desde arriba con focos incandescentes y regulador.","Cambia el UVB cada 12 meses."]],["Manejo",["Es para observar: no le gusta que lo carguen y muerde si se asusta.","Si te muerde, ponlo en una superficie plana y espera a que suelte; no lo jales.","Nunca lo agarres de la cola: puede soltarla.","Lávate las manos antes y después (Salmonella)."]]],"alertas":["No come, adelgaza o está aletargado.","Moco en nariz u ojos, o respira con la boca abierta.","Llagas o mucha baba en la boca.","Piel de muda pegada, hinchazón o cojea."],"rutina":{"Diario":["Revisa temperatura","Rocía en la noche","Retira heces y uratos"],"Semanal":["Insectos según su etapa","Multivitamínico en los insectos","Lava el bebedero con desinfectante veterinario"],"Mensual":["Limpia vidrios","Revisa focos, UVB y termostato","Revisa que la tapa cierre bien"]},"local":["Legalidad en México","El tokay está en el Apéndice II de CITES desde el 26 de noviembre de 2019. Cómpralo solo en UMA o PIMVS con documentos que acrediten su origen legal, y nunca lo liberes."]},
  leachianus:{"alias":"Leachianus, leachie, gecko gigante de Nueva Caledonia","nombre":"Gecko gigante de Nueva Caledonia","sci":"Rhacodactylus leachianus","lead":"El gecko más grande del mundo: trepador, nocturno y con voz propia (chilla y ladra). Necesita un terrario alto y grande, y no tolera el calor.","ficha":[["Tamaño","23 a 43 cm (henkeli 23 a 30 cm; leachianus 36 a 43 cm)"],["Vida","20 a 30 años"],["Actividad","De noche"],["Terrario","Base de 120 × 60 cm, 120 cm de alto (henkeli: base de 90 × 45 cm, 90 cm de alto)"],["Nivel","Intermedio"]],"temp":{"bands":[[22,26,"Ambiente"],[30,31,"Zona de asoleo"]],"note":"De noche debe bajar a 19–22 °C. Es muy sensible al calor: el ambiente no debe pasar de lo indicado. El foco de calor siempre con termostato o regulador."},"hum":{"bands":[[60,80,"Promedio"]],"note":"Puede bajar a 50 % de día y subir a 100 % de noche. Rocía cada tarde-noche y otra vez en la mañana si hace falta. Mide a media altura con higrómetro de sonda."},"cards":[["Alimentación",["Papilla comercial tipo crested gecko diet (Pangea, Repashy u otras) como base.","Insectos vivos: grillos, cucarachas dubia, discoides o red runner, hornworms.","Espolvorea los insectos con calcio.","Ratón bebé (pinky) solo como premio muy ocasional."]],["Terrario y sustrato",["Vertical y grande: le importa la altura.","Ramas gruesas, corcho y plantas para trepar y esconderse.","Sustrato de tierra tipo selva de al menos 7.5 cm de fondo.","Uno por terrario."]],["Luz y calor",["Al menos 12 horas de luz; si quieres, 14 en verano y 10 en invierno.","UVB recomendada: tubo T5 HO 5.0 o Arcadia Forest 6 % (índice UV 2 a 3 en la rama de asoleo).","La rama de asoleo a 23–30 cm debajo del tubo.","Calor desde arriba, siempre con termostato o regulador."]],["Manejo",["Espera 2 semanas antes de cargarlo.","Empieza con sesiones de 5 minutos cada tercer día y sube poco a poco.","Cárgalo de tarde o de noche, que es cuando está activo.","Nunca lo agarres de la cola: se le puede caer."]]],"alertas":["No come después de 2 semanas de haber llegado: no lo cargues y llévalo al veterinario de reptiles.","Se ve aletargado o con la boca abierta cuando hace calor: puede ser golpe de calor.","Piel de muda pegada en dedos o cola.","Ojos hundidos, bultos, heridas o secreción en ojos o cloaca."],"rutina":{"Diario":["Revisa temperatura y humedad","Rocía el terrario en la tarde","Retira desechos"],"Semanal":["Comidas según su etapa","Talla el bebedero","Pésalo cada 2 semanas"],"Mensual":["Limpia vidrios","Revisa focos, UVB y termostato","Poda plantas"]},"local":["Calor en Nuevo León","Su ambiente ideal es de 22–26 °C y es muy sensible al calor: en verano necesita un cuarto con aire acondicionado. Cómpralo solo de criadores o tiendas con documentos de origen legal."]},
  chahoua:{"alias":"Chahoua, chewie, gecko musgoso","nombre":"Gecko chahoua","sci":"Mniarogekko chahoua","lead":"Un gecko trepador con piel que parece musgo y cola que se agarra de las ramas. Tranquilo y fácil de mantener si no se calienta de más.","ficha":[["Tamaño","25 a 31 cm"],["Vida","15 a 20 años"],["Actividad","De noche"],["Terrario","Mínimo 60 × 60 cm de base y 90 cm de alto (o base de 90 × 45 cm con 90 cm de alto)"],["Nivel","Principiante"]],"temp":{"bands":[[22,24,"Lado fresco"],[28,29,"Zona de asoleo"]],"note":"De noche puede bajar a 18–22 °C. Nunca debe pasar de 29 °C ni bajar de 18 °C: estar mucho tiempo fuera de ese rango puede matarlo. El foco de calor siempre con termostato o regulador.","danger":29},"hum":{"bands":[[60,80,"Promedio"]],"note":"Rocía cada tarde-noche y otra vez en la mañana si hace falta. El sustrato debe secarse un poco entre rociadas, sin quedar seco del todo ni encharcado."},"cards":[["Alimentación",["Mitad papilla comercial tipo crested gecko diet y mitad insectos vivos.","Rota al menos 3 sabores o marcas de papilla.","Insectos: grillos, cucarachas dubia, discoides o red head, langostas.","Espolvorea los insectos con calcio; aliméntalos bien 2 a 3 días antes de dárselos."]],["Terrario y sustrato",["Vertical: ramas, corcho y plantas vivas.","Le gusta la sombra entre plantas más que estar arriba.","Sustrato de tierra tipo selva; cámbialo completo cada 3 a 4 meses.","Uno por terrario."]],["Luz y calor",["UVB suave: índice UV de 1 a 2 en la parte alta.","La rama de asoleo al menos a 15 cm del foco.","Calor con 2 focos incandescentes de 40 W como punto de partida; ajusta según tu cuarto.","Crías de menos de 20 g: terrario chico (30 × 30 × 30 cm) sin UVB ni foco de calor."]],["Manejo",["Espera 2 semanas antes de cargarlo.","Sesiones de 5 minutos cada tercer día al principio; sube poco a poco.","Cárgalo de tarde, cerca del piso o de algo suave por si brinca.","Nunca lo agarres de la cola: se le puede caer."]]],"alertas":["No come después de 2 semanas de haber llegado: no lo cargues y llévalo al veterinario.","Aletargado o boca abierta cuando el terrario pasa de 29 °C.","Piel de muda pegada en dedos o cola (humedad muy baja).","Adelgaza, ojos hundidos o secreción en ojos o cloaca."],"rutina":{"Diario":["Revisa temperatura","Rocía en la tarde","Agua limpia","Retira desechos"],"Semanal":["Comidas según su etapa","Talla el bebedero con desinfectante veterinario","Pésalo cada 2 semanas"],"Mensual":["Limpia vidrios","Revisa focos, UVB y termostato","Poda plantas"]},"local":["Calor en Nuevo León","Nunca debe pasar de 29 °C: en verano necesita estar en un cuarto con aire acondicionado todo el día. Cómpralo solo de criadores o tiendas con documentos de origen legal."]},
  uromastyx:{"alias": "Uromastyx, uro, lagarto de cola espinosa", "nombre": "Uromastyx", "sci": "Uromastyx spp. (U. ornata, U. geyri y otras)", "lead": "Un lagarto del desierto que come casi puras verduras, se asolea a pleno sol y excava madrigueras. Necesita mucho calor, mucha UVB y un ambiente seco.", "ficha": [["Tamaño", "22 a 75 cm según la especie; las más comunes llegan a unos 38 cm"], ["Vida", "Más de 25 años (posiblemente hasta 60)"], ["Actividad", "De día"], ["Terrario", "Base de 120 × 60 cm, 60 cm de alto (especies grandes: mucho más)"], ["Nivel", "Intermedio"]], "temp": {"bands": [[29, 29, "Lado fresco"], [32, 38, "Lado caliente"], [49, 55, "Zona de asoleo (superficie)"]], "note": "La zona de asoleo se mide en la superficie de la piedra, con termómetro infrarrojo: debe estar a 49–55 °C. De noche apaga todo; si el terrario baja de 18 °C, pon calor sin luz (cerámica) con termostato."}, "hum": {"bands": [[20, 30, "Ambiente"]], "note": "Seco. Mide en el lado fresco, a nivel del piso. La madriguera sí debe estar algo húmeda: agrega agua al fondo del sustrato y deja seca la capa de arriba (unos 2.5 cm). La humedad alta por mucho tiempo lo enferma."}, "cards": [["Alimentación", ["Casi todo verduras de hoja: col rizada (collard), hojas de mostaza, diente de león, hierbas silvestres sin pesticidas.", "Flores sin pesticidas: diente de león, trébol, jamaica (hibisco).", "Un poco de verdura dura rallada: calabaza, zanahoria, ejote, chícharo, nopal.", "Alimento seco para herbívoros, semillas (lentejas, mijo) e insectos solo como extra."]], ["Terrario y sustrato", ["Horizontal y amplio: le importa el piso.", "Sustrato de tierra y arena para excavar, de al menos 10 cm de fondo.", "Piedra plana (laja) para asolearse bajo el foco.", "Uno por terrario; en pareja necesita el doble de espacio."]], ["Luz y calor", ["UVB fuerte obligatoria: tubo T5 HO de 14 % (índice UV 4.5 a 6 en la zona de asoleo).", "El tubo cubre la mitad del terrario, del lado caliente.", "Calor con focos halógenos (PAR38 de 100 W); piedra a 25–30 cm del foco.", "Luz blanca brillante aparte (6500 K) para que esté activo."]], ["Manejo", ["Déjalo en paz unas 2 semanas al llegar.", "Gánate su confianza dándole comida con la mano o con pinzas suaves.", "Levántalo desde abajo y despacio; nunca por arriba como un depredador.", "Casi no muerde, pero si lo acorralas puede dar coletazos."]]], "alertas": ["No come después de las 2 semanas de adaptación: llévalo al veterinario.", "No se asolea, está aletargado o se mueve raro.", "Ojos pegados, hinchados o hundidos, o secreción en ojos o cloaca.", "Bultos, hinchazones o llagas rosadas en la piel."], "rutina": {"Diario": ["Revisa temperatura de la piedra", "Verduras frescas (juveniles)", "Retira heces y restos de comida"], "Semanal": ["Calcio y vitaminas en las verduras 2 veces", "Humedece el fondo de la madriguera", "Pésalo cada 2 semanas"], "Mensual": ["Limpia vidrios", "Revisa focos y termostato", "Cambia el sustrato cada 3 a 4 meses"]}, "local": ["Legalidad en México", "Los Uromastyx están en el Apéndice II de CITES. Cómpralo solo en UMA o PIMVS con documentos que acrediten su origen legal; muchos se sacan del medio silvestre. En Nuevo León el calor no es problema, pero la humedad de la madriguera sí hay que cuidarla."]},
  tegu:{"alias":"Tegu, tegu blanco y negro, tegu argentino, lagarto overo","nombre":"Tegu argentino blanco y negro","sci":"Salvator merianae","lead":"Un lagarto enorme, inteligente y que llega a ser muy manso, casi como un perro. Pide un recinto del tamaño de una cama y años de compromiso.","ficha":[["Tamaño","90 a 150 cm (hasta 160 cm y 5 kg)"],["Vida","15 a 20 años"],["Actividad","De día"],["Terrario","Recinto de 240 × 120 cm, 120 cm de alto (a medida)"],["Nivel","Avanzado"]],"temp":{"bands":[[24,29,"Lado fresco"],[29,35,"Lado caliente"],[52,57,"Zona de asoleo (superficie)"]],"note":"La zona de asoleo se mide en la superficie de la laja con termómetro infrarrojo: 52–57 °C. De noche no debe bajar de 24 °C. Si la temperatura baja de unos 20 °C, desde mediados de septiembre puede empezar a hibernar (brumar) varios meses."},"hum":{"bands":[[70,80,"Promedio"],[90,100,"Escondite húmedo"]],"note":"Rocía todos los días y pon un recipiente de agua donde quepa completo para remojarse. Con humedad baja muda mal."},"cards":[["Alimentación",["Omnívoro: la mayor parte proteína y el resto verduras y algo de fruta.","Crías: sobre todo insectos (grillos, cucarachas, superworms) con calcio.","Adultos: presas enteras muertas o descongeladas (ratones, ratas, pollitos); nunca roedores vivos.","Premios ocasionales: pavo molido magro, pescado, huevo."]],["Terrario y sustrato",["Recinto a medida; si son dos, el doble de espacio.","Sustrato de tierra y arena húmeda para excavar, de al menos 15 cm (ideal hasta 60 cm).","Laja grande para asolearse (unos 0.4 a 0.5 m²).","Escondite húmedo y recipiente grande de agua."]],["Luz y calor",["UVB obligatoria: 2 tubos T5 HO de 12 % (índice UV 3 a 4 en la zona de asoleo).","12 a 14 horas de luz al día; sol directo sin vidrio cuando el clima lo permita.","Calor con varios focos halógenos PAR38, con termostato.","Luz blanca brillante aparte (6000 a 7000 K)."]],["Manejo",["Mientras más lo manejes desde chico, más manso se vuelve.","Dale de comer en plato o con pinzas: si come con la mano, puede morder por accidente.","Lávate las manos con agua y jabón después de tocarlo: puede portar Salmonella.","Vigila su peso: los adultos engordan con facilidad."]]],"alertas":["Muda pegada en dedos o cola: humedad baja.","No come y está aletargado fuera de la temporada de hibernación.","Ojos hundidos o hinchados, o secreción en ojos o cloaca.","Sobrepeso: panza que arrastra o pliegues de grasa."],"rutina":{"Diario":["Revisa temperatura de la laja","Agua limpia para beber y remojarse","Rocía el recinto","Retira heces"],"Semanal":["Comidas según su etapa","Multivitamínico 1 vez","Pésalo cada 2 semanas"],"Mensual":["Revisa focos, UVB y termostato","Remueve y humedece el sustrato","Limpia escondites"]},"local":["Legalidad en México","El tegu está en el Apéndice II de CITES. Cómpralo solo en UMA o PIMVS con documentos de origen legal. Nunca lo liberes: en Florida y Georgia (EE. UU.) se volvió especie invasora."]},
  alfombra:{"alias": "Pitón alfombra, carpet python, morelia", "nombre": "Pitón alfombra", "sci": "Morelia spilota", "lead": "Una pitón grande, de actividad nocturna y que trepa: necesita un terrario amplio y alto. De joven puede ser nerviosa y morder, pero con paciencia se vuelve manejable.", "ficha": [["Tamaño", "1.5 a 2.5 m"], ["Vida", "20 a 30 años o más"], ["Actividad", "Sobre todo de noche"], ["Terrario", "Base de 200 × 90 cm, 90 cm de alto (adulto)"], ["Nivel", "Intermedio"]], "temp": {"bands": [[24, 26, "Lado fresco"], [35, 38, "Zona de asoleo (superficie)"]], "note": "Los 35–38 °C se miden en la superficie donde se asolea (con termómetro infrarrojo), no en el aire. De noche puede bajar a 22–25 °C. En invierno puedes bajar todo 3–5 °C. El calor siempre va con termostato."}, "hum": {"bands": [[40, 60, "Ambiente"]], "note": "Rocía el terrario 2 a 3 veces al día para mantener la humedad."}, "cards": [["Alimentación", ["Roedores congelados y descongelados (ratones y ratas).", "La presa debe pesar cerca del 10 % del peso de la serpiente.", "Que la presa no sea más de 1.5 veces más ancha que la parte más gruesa de su cuerpo.", "Descongela la presa y caliéntala a unos 38 °C antes de ofrecerla; usa pinzas, no los dedos."]], ["Terrario y sustrato", ["Necesita altura: mínimo 90 cm para que trepe.", "Pon ramas firmes y escondites en el lado caliente y en el fresco.", "Sustrato de 5 a 10 cm de profundidad que guarde algo de humedad.", "Plato de agua grande, limpio y desinfectado cada semana."]], ["Luz y calor", ["14 horas de luz en verano y 10 en invierno.", "UVB que dé un índice UV de 2 a 3 en la zona de asoleo.", "Lámpara de calor arriba del área de asoleo, con termostato y protegida para que no se queme."]], ["Manejo", ["Al inicio, sesiones de máximo 5 minutos cada pocos días.", "Con el tiempo puedes llegar a 10–15 minutos diarios.", "Las menores de 2 años suelen ser nerviosas y morder: ten paciencia.", "No la cargues recién comida ni cuando esté en muda."]]], "alertas": ["No come en varias comidas seguidas y no está en muda.", "Regurgita (devuelve) la comida.", "Respira con la boca abierta o tiene moco en la nariz.", "Secreción en boca o cloaca, heridas o letargo fuera de lo normal."], "rutina": {"Diario": ["Revisa temperatura y humedad", "Rocía el terrario", "Agua limpia"], "Semanal": ["Comida según su etapa", "Lava y desinfecta el plato de agua", "Retira desechos"], "Mensual": ["Limpia vidrios y ramas", "Revisa focos y termostato", "Cambia todo el sustrato cada 3–4 meses"]}, "local": ["Legalidad en México", "La pitón alfombra está en el Apéndice II de CITES (como casi todas las pitones). No es especie nativa de México: cómprala solo a una UMA o PIMVS registrada y exige factura y documentos de procedencia legal."]},
  arcoiris:{"alias": "Boa arcoíris, boa arcoíris brasileña, rainbow boa", "nombre": "Boa arcoíris brasileña", "sci": "Epicrates cenchria", "lead": "Una boa mediana famosa por el brillo tornasol de sus escamas. Es nocturna y necesita mucha humedad; si eso se cuida, se vuelve dócil con el manejo.", "ficha": [["Tamaño", "1.5 a 2 m"], ["Vida", "Hasta 30 años"], ["Actividad", "De noche"], ["Terrario", "Base de 180 × 90 cm, 90 cm de alto (adulto)"], ["Nivel", "Intermedio"]], "temp": {"bands": [[26, 29, "Ambiente de día"], [30, 32, "Zona de asoleo (superficie)"]], "note": "Los 30–32 °C se miden en la superficie donde se asolea. De noche puede bajar a 22–24 °C. No le gusta el calor fuerte: es una especie de selva. El calor siempre va con termostato. Ojo: la zona de asoleo es la temperatura de la superficie bajo el foco, medida con termómetro infrarrojo (pistola); el aire debe estar más fresco y siempre debe haber zonas frescas."}, "hum": {"bands": [[70, 80, "Ambiente de día"], [90, 100, "De noche y crías (menos de 1 año)"]], "note": "De noche la humedad debe subir casi al 100 %. Las crías menores de 1 año necesitan 90–100 % todo el tiempo. Sin suficiente humedad tiene problemas de muda."}, "cards": [["Alimentación", ["Roedores congelados y descongelados; las crías empiezan con ratones recién nacidos (pinkies).", "La presa debe pesar cerca del 10 % de su peso (si no está obesa).", "Que la presa no sea más ancha que la parte más gruesa de su cuerpo.", "Ofrécela con pinzas, no con los dedos."]], ["Terrario y sustrato", ["Sustrato que guarde humedad, de unos 10 cm de profundidad.", "Escondites en el lado caliente y en el fresco.", "Recipiente de agua grande donde quepa todo su cuerpo para remojarse.", "Cambia todo el sustrato cada 3 a 4 meses."]], ["Luz y calor", ["Ciclo de 12 horas de luz y 12 de oscuridad.", "UVB que dé un índice UV de 2 a 3 en la zona de asoleo; cambia el foco cada 12 meses.", "Lámpara de calor con termostato; protégela para que no se queme."]], ["Manejo", ["Empieza de noche, con sesiones de máximo 5 minutos cada pocos días.", "Tras un par de semanas alarga poco a poco, hasta 10–15 minutos diarios.", "Evita cargarla durante la muda.", "Lávate las manos antes y después de tocarla."]]], "alertas": ["Ojos opacos o con piel pegada, fuera de la muda.", "Ampollas, llagas o muda pegada.", "Boca roja o con secreción, o secreción en la cloaca.", "No come en más de un par de comidas y no está en muda."], "rutina": {"Diario": ["Revisa temperatura y humedad", "Rocía el terrario", "Agua limpia"], "Semanal": ["Comida según su etapa", "Limpia y desinfecta el terrario y el recipiente de agua", "Retira desechos"], "Mensual": ["Limpia vidrios", "Revisa focos y termostato", "Cambia todo el sustrato cada 3–4 meses"]}, "local": ["Legalidad en México", "La boa arcoíris está en el Apéndice II de CITES. No es nativa de México: cómprala solo a una UMA o PIMVS registrada, con factura y documentos de procedencia legal."]},
  patasrojas:{"alias": "Tortuga patas rojas, morrocoy, red foot", "nombre": "Tortuga patas rojas", "sci": "Chelonoidis carbonarius", "lead": "Una tortuga terrestre de selva, activa y curiosa. Come más variado que otras tortugas (incluye fruta y algo de proteína) y necesita mucho espacio y humedad.", "ficha": [["Tamaño", "30 a 46 cm de caparazón (hasta 61 cm)"], ["Vida", "50 años o más"], ["Actividad", "De día"], ["Terrario", "Mínimo 240 × 120 cm de piso (adulto); mejor corral en patio"], ["Nivel", "Intermedio"]], "temp": {"bands": [[24, 29, "Ambiente y lado fresco"], [32, 35, "Zona de asoleo"]], "note": "De noche 20–23 °C; las crías un poco más cálidas. En patio, si la noche baja de 10 °C, dale calor extra (21–24 °C) en su refugio; si de día no pasa de 18 °C, métela a casa. La lámpara de calor debe estar a 30 cm o más del caparazón para que no se queme."}, "hum": {"bands": [[70, 90, "Ambiente"]], "note": "Puede subir a 100 % por ratos sin problema. Rocía 2 a 3 veces al día."}, "cards": [["Alimentación", ["Cerca de 90 % plantas y 10 % proteína animal.", "De la parte vegetal: hojas, flores y fruta (la mayor parte) más pastos y verduras.", "Proteína baja en grasa: insectos, lombrices u hongos, en poca cantidad.", "Sirve la comida en un plato para que no trague sustrato."]], ["Terrario y sustrato", ["Mínimo 10 cm de sustrato húmedo adentro (30 cm en patio) y 2.5 cm de hojarasca encima.", "Plato de agua bajo para que se remoje; enjuágalo a diario y desinféctalo si hace popó en él.", "En patio, bardas de 60 cm o más, enterradas 30 cm.", "Cada tortuga extra necesita 1.5 m² más de espacio."]], ["Luz y calor", ["13 horas de luz en verano y 11 en invierno.", "UVB que dé un índice UV de 2 a 3 en la zona de asoleo; en patio no necesita focos.", "Lámpara de calor a 30 cm o más del caparazón."]], ["Importante", ["No la pongas en terrarios pequeños: camina mucho.", "Al llegar a adulta, si sigue comiendo diario puede engordar de más.", "Evita caídas: un golpe puede romperle el caparazón."]]], "alertas": ["Deja de comer o come mucho menos.", "Respira con la boca abierta, con moco en la nariz u ojos hinchados.", "Letargo o cambios en sus desechos (diarrea, orina con olor fuerte).", "Caparazón blando, deforme o con golpes."], "rutina": {"Diario": ["Revisa temperatura y humedad", "Rocía 2–3 veces", "Comida según su etapa", "Agua limpia y retira desechos"], "Semanal": ["Pésala", "Revisa ojos, nariz y caparazón"], "Mensual": ["Limpia vidrios", "Revisa focos y termostato", "Cambia todo el sustrato cada 3–6 meses"]}, "local": ["Legalidad y calor en Nuevo León", "Esta especie está en el Apéndice II de CITES. En verano regiomontano dale sombra, charco y riego en el patio: es de selva y el aire seco y muy caliente le afecta."]},
  leopardotortuga:{"alias": "Tortuga leopardo, leopardo africana", "nombre": "Tortuga leopardo", "sci": "Stigmochelys pardalis", "lead": "Una tortuga africana de pastizal que crece mucho y vive muchísimos años. Lo suyo es pastar: necesita un patio grande con pasto y sol más que un terrario.", "ficha": [["Tamaño", "30 a 51 cm de caparazón; hembras unos 14 kg, machos hasta 20 kg"], ["Vida", "Más de 50 años (promedio en cautiverio de 20 a 50)"], ["Actividad", "De día"], ["Terrario", "Crías: 120 × 60 cm. Adultas: corral en patio de 3 × 3 m o más"], ["Nivel", "Intermedio"]], "temp": {"bands": [[24, 29, "Ambiente y lado fresco"], [35, 40, "Zona de asoleo"]], "note": "De noche, en interior, que no baje de 22 °C. En patio, si la noche baja de 16 °C, necesita una casita con calor a 16–21 °C; si de día no pasa de 16–21 °C, métela o dale calor. La lámpara debe estar a 20 cm o más del caparazón."}, "hum": {"bands": [[40, 50, "Ambiente (adultas)"]], "note": "Ambiente más bien seco. Las crías sí necesitan un escondite o rincón húmedo (las fuentes no dan un porcentaje exacto)."}, "cards": [["Alimentación", ["Cerca de 90 % pastos y hierbas, y 10 % hojas verdes y verduras.", "Lo ideal es que paste en un patio con pasto variado; heno seco de pradera como base.", "Nopal (penca y tuna) y suculentas también le sirven.", "Evita la fruta: tiene mucha azúcar."]], ["Terrario y sustrato", ["Crías: terrario de 120 × 60 cm los primeros años.", "Adultas: corral de 3 × 3 m o más, con bardas opacas de 45 cm.", "Sustrato de 7.5 cm o más en interior; cámbialo completo cada 3–4 meses.", "Plato de agua que no le pase de los codos."]], ["Luz y calor", ["14 horas de luz en verano y 10 en invierno.", "UVB de alta potencia en interior; en patio con sol directo no necesita foco.", "Lámpara de calor a 20 cm o más del caparazón, con termostato."]], ["Importante", ["Crece mucho: planea un patio para cuando sea adulta.", "Ten siempre un hueso de jibia en el corral para calcio.", "Una dieta de pasto con fibra le da un caparazón liso, sin bultos."]]], "alertas": ["Respira con la boca abierta, estira el cuello para respirar o tiene moco en la nariz.", "Mucha saliva o tos raspada.", "No come, baja de peso o toma agua de más.", "Ojos hinchados u orina con olor muy fuerte."], "rutina": {"Diario": ["Comida (pasto/hierbas)", "Agua limpia", "Retira desechos"], "Semanal": ["Baño tibio (crías) 1–2 veces", "Desinfecta comedero y bebedero", "Pésala"], "Mensual": ["Revisa focos y termostato", "Revisa bardas y refugio del corral", "Cambia todo el sustrato cada 3–4 meses"]}, "local": ["Calor en Nuevo León", "Es de pastizal seco y aguanta bien el calor si tiene sombra y refugio para enterrarse. Esta especie está en el Apéndice II de CITES."]}
};

function normItem(it){
  it=it||{};it.datos=it.datos||{};it.fotos=Array.isArray(it.fotos)?it.fotos.filter(Boolean):[];
  if(!it.fotos.length&&it.foto)it.fotos=[it.foto];
  if(it.cantidad==null||it.cantidad==="")it.cantidad=it.estado==="vendido"?0:1;
  it.cantidad=Math.max(0,parseInt(it.cantidad,10)||0);
  if(it.estado!=="apartado")it.estado="disponible";
  if(it.tipo==="animal"&&!it.datos.especie&&it.especie)it.datos.especie=it.especie;
  if(it.tipo==="pieza"&&!it.datos.medidas&&it.medidas)it.datos.medidas=it.medidas;
  return it;
}
function autoName(it){var d=it.datos||{};
  return it.tipo==="terrario"?("Terrario "+(d.estilo||"bioactivo").toLowerCase()+(d.base?" "+d.base.replace(" cm",""):"")):it.tipo==="animal"?((d.especie||"Ejemplar")+(d.sexo&&d.sexo!=="Sin sexar"?" "+d.sexo.toLowerCase():"")):((d.pieza||"Pieza")+" 3D");
}
function itemName(it){return it.nombre||autoName(it)}
function itemMeta(it){var d=it.datos||{},m=[];
  if(it.tipo==="terrario"){if(d.base)m.push("Base "+d.base);if(d.alto)m.push(d.alto+" cm de alto");if(d.estilo)m.push(d.estilo);if(d.para)m.push("Para "+d.para.toLowerCase())}
  else if(it.tipo==="animal"){if(d.especie&&it.nombre)m.push(d.especie);if(d.sexo)m.push(d.sexo);if(d.edad)m.push(d.edad);if(d.morfo)m.push(d.morfo);if(d.peso)m.push(d.peso+" g")}
  else {if(d.medidas)m.push(d.medidas);if(d.color)m.push(d.color);if(d.material)m.push(d.material);if(d.para)m.push("Para "+d.para)}
  if(!m.length){if(it.especie)m.push(it.especie);if(it.medidas)m.push(it.medidas)}

}

function scaleTicks(min,max,step,unit){var s='';for(var v=min;v<=max;v+=step){s+='<span style="left:'+((v-min)/(max-min)*100)+'%">'+v+unit+'</span>'}return '<div class="ticks">'+s+'</div>'}
function gauge(kind,data,min,max,unit,title){
  var bands=data.bands.map(function(b){return '<div class="band" style="left:'+((b[0]-min)/(max-min)*100)+'%;width:'+((b[1]-b[0])/(max-min)*100)+'%" title="'+esc(b[2])+'"></div>'}).join("");
  var mk = data.danger?'<div class="mark" style="left:'+((data.danger-min)/(max-min)*100)+'%" title="Peligro"></div>':'';
  var keys=data.bands.map(function(b){return '<span><b>'+b[0]+'–'+b[1]+unit+'</b> '+esc(b[2])+'</span>'}).join("")+(data.danger?'<span style="color:var(--bad)"><b>'+data.danger+unit+'+</b> Peligro</span>':'');
  return '<div class="gauge"><div class="lbl"><span>'+title+'</span><span>'+unit.trim()+'</span></div><div class="bar '+kind+'">'+bands+mk+'</div>'+scaleTicks(min,max,kind==="temp"?5:25,kind==="temp"?"°":"%")+'<div class="keys">'+keys+'</div><p class="note">'+esc(data.note)+'</p></div>';
}

    box.innerHTML='<div class="progress" aria-label="Pregunta '+(q.i+1)+' de '+QUIZ.length+'">'+QUIZ.map(function(_,i){return '<i class="'+(i<=q.i?"on":"")+'"></i>'}).join("")+'</div>'+
      '<span class="eyebrow">Pregunta '+(q.i+1)+' de '+QUIZ.length+'</span><h3>'+cur.q+'</h3><div class="opts">'+
      cur.o.map(function(o,i){return '<button data-ans="'+i+'">'+o[0]+'</button>'}).join("")+'</div>';
    art.innerHTML=terrSVG({shape:"h",style:["desierto","selva","bosque"][q.i%3],seed:5+q.i,label:"Terrario"});
    return;
  }
  var ranked=SPP.slice().sort(function(a,b){return q.score[b]-q.score[a]||SPP.indexOf(a)-SPP.indexOf(b)});
  var sp=ranked[0], alt=ranked[1], g=GUIDES[sp];

    '<button class="btn btn-ghost" data-quiz-reset>Realizar de nuevo</button></div></div>';
  art.innerHTML=quizArt(sp);
}

var IN_CLAUDE=!!(window.claude&&window.claude.use);
function lsGet(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){toast("No se pudo guardar en este navegador");return false}}
function pad(n){return (n<10?"0":"")+n}
function isoDate(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function todayISO(){return isoDate(new Date())}
function parseISO(s){var p=String(s||"").split("-");return new Date(+p[0],(+p[1]||1)-1,+p[2]||1)}
function addDays(s,n){var d=parseISO(s);d.setDate(d.getDate()+n);return isoDate(d)}
function addMonths(s,n){var d=parseISO(s);d.setMonth(d.getMonth()+n);return isoDate(d)}
function daysBetween(a,b){return Math.round((parseISO(b)-parseISO(a))/86400000)}
function fmtDate(s){try{return parseISO(s).toLocaleDateString("es-MX",{day:"numeric",month:"short",year:"numeric"})}catch(e){return s}}
function isoWeek(d){var t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));var n=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-n);var y=new Date(Date.UTC(t.getUTCFullYear(),0,1));return t.getUTCFullYear()+"-S"+Math.ceil(((t-y)/86400000+1)/7)}
function saveFile(name,text,mime){
  if(IN_CLAUDE){
    window.claude.use("downloads").then(function(d){
      if(!d){toast("Las descargas funcionan en la página pública");return}
      return d.save({filename:name,data:text}).then(function(){toast("Archivo listo")});
    }).catch(function(e){toast(e&&e.code==="rejected_extension"?"Este tipo de archivo se descarga desde la página pública":"No se pudo descargar aquí")});
    return;
  }
  try{var b=(text instanceof Blob)?text:new Blob([text],{type:mime||"text/plain"}),u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(u);a.remove()},500);toast("Descargando "+name)}catch(e){toast("No se pudo descargar")}
}
function icsEsc(s){return String(s).replace(/\\/g,"\\\\").replace(/;/g,"\;").replace(/,/g,"\\,").replace(/\n/g,"\\n")}
function buildICS(events){
  var now=new Date(),stamp=now.getUTCFullYear()+pad(now.getUTCMonth()+1)+pad(now.getUTCDate())+"T"+pad(now.getUTCHours())+pad(now.getUTCMinutes())+"00Z";
  var L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Reppets//Cuidados//ES","CALSCALE:GREGORIAN","X-WR-CALNAME:Reppets · Cuidados"];
  events.forEach(function(e,i){
    var d=e.date.replace(/-/g,"");
    L.push("BEGIN:VEVENT","UID:reppets-"+stamp+"-"+i+"@reppets","DTSTAMP:"+stamp,"DTSTART:"+d+"T"+(e.time||"0900")+"00","DURATION:PT15M","SUMMARY:"+icsEsc(e.title));
    L.push("DESCRIPTION:"+icsEsc((e.desc?e.desc+"\n":"")+"Reppets · reppets.vercel.app"));
    if(e.every) L.push("RRULE:FREQ=DAILY;INTERVAL="+e.every+";COUNT="+(e.count||Math.max(4,Math.ceil(182/e.every))));
    L.push("BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+icsEsc(e.title),"TRIGGER:PT0M","END:VALARM","END:VEVENT");
  });
  L.push("END:VCALENDAR");return L.join("\r\n");
}

function stageIndex(sp,birth){var st=CAL[sp].st;if(!birth)return st.length-1;var m=daysBetween(birth,todayISO())/30.4;for(var i=0;i<st.length;i++){if(st[i][1]==null||m<st[i][1])return i}return st.length-1}
function feedEvery(sp,i){return CAL[sp].st[Math.min(i,CAL[sp].st.length-1)][2]}
function everyTxt(a,b){return a===1&&b===1?"Todos los días":a===b?"Cada "+a+" días":(a===1?"A diario o cada "+(b===2?"2":"2 a "+b)+" días":"Cada "+a+" a "+b+" días")}
function extraN(x,ai){var v=x[1];return Array.isArray(v)?v[Math.min(ai,v.length-1)]:v}
function calEvents(sp,ai,start){
  var c=CAL[sp],g=GUIDES[sp],s=c.st[ai],ev=[{date:start,title:g.nombre+": "+c.label,every:s[2],desc:s[4]+" · Reppets ("+s[0].toLowerCase()+")"}];
  c.extras.forEach(function(x){var n=extraN(x,ai);if(n)ev.push({date:start,title:g.nombre+": "+x[0],every:n,time:"2000"})});
  if(!c.noUvb)ev.push({date:addMonths(start,12),title:g.nombre+": revisar o cambiar el foco UVB",desc:"Los focos UVB pierden fuerza aunque sigan prendiendo."});
  return ev;
}
function periodKey(k){var d=new Date();return k==="Diario"?todayISO():k==="Semanal"?isoWeek(d):(d.getFullYear()+"-"+pad(d.getMonth()+1))}
function checklistCard(sp,cid){
  var g=GUIDES[sp],st=lsGet("rp-check-"+sp,{});cid=cid||"g";
  return '<div class="gcard wide" data-checkcard="'+sp+'" data-cid="'+cid+'"><div class="cardhead"><h3>Lista de mantenimiento</h3><span class="note">Se reinicia sola cada día, semana y mes.</span></div><div class="routine">'+Object.keys(g.rutina).map(function(k){
    var p=periodKey(k),done=(st[k]&&st[k].p===p)?st[k].d:[],items=g.rutina[k];
    return '<div><h4>'+k+' · '+done.length+'/'+items.length+'</h4>'+items.map(function(x,i){var on=done.indexOf(i)>=0;return '<label class="chk"><input type="checkbox" data-chk="'+sp+'|'+k+'|'+i+'"'+(on?" checked":"")+'><span>'+x+'</span></label>'}).join("")+'</div>'}).join("")+'</div></div>';
}
function calendarCard(sp,cid,ai){
  var c=CAL[sp];if(!c)return "";cid=cid||"g";ai=ai==null?c.st.length-1:ai;
  return '<div class="gcard wide feedcard"><div class="cardhead"><h3>Alimentación: cada cuánto y cuánto</h3><span class="note">'+(cid==="p"?'Resaltamos la etapa de su mascota según su edad.':'Según la etapa de vida.')+'</span></div>'+
  '<div class="feedtbl">'+c.st.map(function(s,i){return '<div class="frow'+(cid==="p"&&i===ai?' on':'')+'"><b>'+s[0]+'</b><span class="fevery">'+everyTxt(s[2],s[3])+'</span><span class="fpor">'+s[4]+'</span></div>'}).join("")+'</div>'+
  '<p class="note"><b>Suplementos:</b> '+c.sup+'</p><p class="note"><b>Importante:</b> '+c.nota+'</p>'+
  '<div class="calrow noprint"><div class="field"><label for="calAge-'+cid+'">Etapa</label><select id="calAge-'+cid+'">'+c.st.map(function(s,i){return '<option value="'+i+'"'+(i===ai?" selected":"")+'>'+s[0]+'</option>'}).join("")+'</select></div>'+
  '<div class="field"><label for="calStart-'+cid+'">Empezar el</label><input type="date" id="calStart-'+cid+'" value="'+todayISO()+'"></div>'+
  '<button class="btn btn-dark" data-cal="'+sp+'|'+cid+'">Descargar recordatorios</button></div><p class="note noprint">Guía general. Ajusta según el cuerpo de tu animal y consulta a un veterinario de exóticos si sube o baja mucho de peso.</p></div>';
}

function plantArt(p){
  var c=p.col,g='',i;
  if(p.forma==="roseta"){for(i=0;i<9;i++){g+=leaf(60,78,30+(i%3)*6,-170+i*20,i%2?c:"#5E8F45",.18)}}
  else if(p.forma==="ancha"){g+='<path d="M60 80V50" stroke="#4A6B35" stroke-width="2"/>'+leaf(60,58,30,-150,c,.42)+leaf(60,50,30,-30,c,.42)+leaf(60,70,24,-120,"#5E8F45",.42)+leaf(60,66,24,-60,"#5E8F45",.42)}
  else if(p.forma==="suculenta"){for(i=0;i<10;i++){g+=leaf(60,78,16+(i%2)*8,-180+i*20,i%2?c:"#7AA06A",.32)}}
  else if(p.forma==="helecho"){for(i=0;i<7;i++){g+=leaf(60,80,30+(i%2)*6,-160+i*23,c,.12)}}
  else if(p.forma==="musgo"){g+='<ellipse cx="60" cy="74" rx="38" ry="14" fill="'+c+'"/><ellipse cx="48" cy="68" rx="18" ry="9" fill="#86B357"/><ellipse cx="72" cy="70" rx="16" ry="7" fill="#5C8A3A"/>'}
  else if(p.forma==="colgante"){g+='<path d="M20 20Q50 40 40 60T80 80" fill="none" stroke="#4A6B35" stroke-width="2"/>';[[26,24],[40,36],[44,50],[42,62],[56,72],[72,78]].forEach(function(q,j){g+=leaf(q[0],q[1],12,j%2?20:-160,c,.45)})}
  else if(p.forma==="cactus"){g+='<ellipse cx="60" cy="60" rx="16" ry="22" fill="'+c+'"/><ellipse cx="40" cy="44" rx="11" ry="15" fill="#7EAA5A" transform="rotate(-25 40 44)"/><ellipse cx="80" cy="46" rx="10" ry="14" fill="#7EAA5A" transform="rotate(25 80 46)"/>'}
  else if(p.forma==="espada"){for(i=0;i<5;i++){g+=leaf(60,80,40+(i%2)*10,-130+i*20,i%2?c:"#5E8F45",.12)}}
  else {g+='<path d="M60 80V48" stroke="#4A6B35" stroke-width="2"/>'+leaf(60,70,22,-150,"#4E8C4A",.4)+leaf(60,64,22,-30,"#4E8C4A",.4);for(i=0;i<5;i++){g+=leaf(60,44,14,i*72,c,.5)}g+='<circle cx="60" cy="44" r="4" fill="#F2C94C"/>'}
  return '<svg viewBox="0 0 120 90" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ilustración de '+esc(p.n)+'"><rect width="120" height="90" fill="#EAE3D2"/><rect y="78" width="120" height="12" fill="#B08B62"/>'+g+'</svg>';
}
function plantsSection(){
  return '<section class="block" id="plantas"><div class="wrap"><div class="sec-head"><span class="eyebrow">Antes de plantar</span><h2>Guía de plantas seguras</h2><p class="lead">Busque una planta y revise si es segura para su reptil, qué humedad necesita y si aguanta animales pesados.</p></div>'+
  '<div class="psearch"><input type="search" id="plantQ" placeholder="Buscar: pothos, sábila, helecho…" aria-label="Buscar planta" autocomplete="off"></div>'+
  '<div class="filters" role="group" aria-label="Filtrar plantas">'+PF.map(function(f){return '<button data-pf="'+f[0]+'" aria-pressed="'+(plantView.f===f[0])+'">'+f[1]+'</button>'}).join("")+'</div>'+
  '<div class="legend"><span class="tox ok">Segura</span> Puede usarla. <span class="tox warn">Precaución</span> Bien con animales que no comen plantas. <span class="tox bad">Tóxica</span> No la use.</div>'+
  '<div class="grid" id="plantGrid"></div>'+'<div class="actions" style="margin-top:18px">'+printBtn("plantGrid","Guía de plantas seguras")+'</div>'+
  '<p class="note" style="margin-top:22px">Fotos de Wikimedia Commons con licencia libre; el crédito de cada una aparece en su tarjeta. Información general basada en listas de plantas para terrarios bioactivos (<a href="https://www.thebiodude.com/blogs/live-plants-mosses-and-growing-guides/the-quick-list-of-edible-plants-for-your-bioactive-terrarium" target="_blank" rel="noopener">The Bio Dude</a>). Lave bien toda planta nueva y retire fertilizantes o pesticidas antes de plantarla. Ante cualquier duda, consulte a un veterinario de exóticos.</p></div></section>';
}
function renderPlants(){
  var q=plantView.q.trim().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,""),f=plantView.f;
  var list=PLANTS.filter(function(p){
    var hay=(p.n+" "+p.sci+" "+p.uso).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
    if(q&&hay.indexOf(q)<0)return false;
    if(f==="todas")return true; if(TOX[f])return p.tox===f; if(HUM[f])return p.hum===f; if(f==="fuerte")return !!p.fuerte; if(f==="com")return !!p.com; return true;
  });
  $$("[data-pf]").forEach(function(b){b.setAttribute("aria-pressed",String(b.getAttribute("data-pf")===f))});
  $("#plantGrid").innerHTML=list.length?list.map(function(p){var t=TOX[p.tox];return '<article class="card pcard tox-'+t[1]+'"><div class="ph">'+plantArt(p)+(p.f?'<img class="photo" loading="lazy" crossorigin="anonymous" alt="Foto de '+esc(p.n)+'" src="'+p.u+'" onerror="this.remove()">':'')+'<span class="tox '+t[1]+'">'+t[0]+'</span></div><div class="body"><h3>'+esc(p.n)+'</h3><span class="sci">'+esc(p.sci)+'</span><div class="ptags"><span class="ptag">'+HUM[p.hum]+'</span>'+(p.fuerte?'<span class="ptag">Resiste reptiles pesados</span>':'')+(p.com?'<span class="ptag">Comestible</span>':'')+'</div><p><b>Para:</b> '+esc(p.uso)+'</p><p class="note">'+esc(p.nota)+'</p>'+(p.f?'<span class="credit">Foto: <a href="'+p.d+'" target="_blank" rel="noopener">'+esc(p.a)+'</a> · '+esc(p.l)+' · Wikimedia Commons</span>':'')+'</div></article>'}).join(""):'<p class="note">No encontramos esa planta. Escríbanos y le decimos si es segura.</p>';
}

var dxPath=["inicio"];
function diagSection(){
  return '<section class="block" id="diagnostico"><div class="wrap"><div class="sec-head"><span class="eyebrow">Solución de problemas</span><h2>Diagnóstico de su bioactivo</h2><p class="lead">Responda unas preguntas y le decimos qué hacer paso a paso, qué ayuda biológica usar y cómo ajustar la ventilación.</p></div><div class="dx" id="dxArea"></div></div></section>';
}
function renderDiag(){
  var cur=dxPath[dxPath.length-1],node=DX[cur],crumbs='';
  for(var i=0;i<dxPath.length-1;i++){var n=DX[dxPath[i]],nx=dxPath[i+1],ch=n.o.filter(function(o){return o[1]===nx})[0];crumbs+='<li><button class="crumb" data-dxback="'+(i+1)+'">'+esc(n.q)+'</button><span>'+esc(ch?ch[0]:"")+'</span></li>'}
  var trail=crumbs?'<ol class="dxtrail">'+crumbs+'</ol>':'';
  var body;
  if(node.q){body='<div class="dxq"><span class="eyebrow">Paso '+dxPath.length+'</span><h3>'+node.q+'</h3><div class="opts">'+node.o.map(function(o){return '<button data-dx="'+o[1]+'">'+o[0]+'</button>'}).join("")+'</div></div>'}
  else{
    var msg="Hola Reppets, usé el diagnóstico de su página y salió: "+node.t+". ¿Me pueden ayudar?";
    body='<div class="dxres"><span class="eyebrow">Diagnóstico</span><h3>'+node.t+'</h3><p class="lead" style="max-width:none">'+node.c+'</p>'+
    '<div class="dxcols"><div class="dxbox"><h4>Qué hacer</h4><ol>'+node.p.map(function(x){return '<li>'+x+'</li>'}).join("")+'</ol></div>'+
    '<div class="dxside">'+(node.b?'<div class="dxbox bio"><h4>Ayuda biológica</h4><p>'+node.b+'</p></div>':'')+'<div class="dxbox air"><h4>Ventilación</h4><p>'+node.v+'</p></div></div></div>'+
    '<div class="actions noprint"><button class="btn btn-ghost" data-dxreset>Empezar otro diagnóstico</button>'+printBtn("dxArea","Diagnóstico: "+node.t)+'<a class="btn btn-dark" target="_blank" rel="noopener" href="'+esc(contactUrl(msg))+'" data-msg="'+esc(msg)+'">Pedir ayuda</a></div></div>';
  }
  $("#dxArea").innerHTML=trail+body;

  d.stock=d.stock.map(normItem);var jobs=[];d.stock.forEach(function(it){it.fotos.forEach(function(f,i){jobs.push(upPhoto(f,"item-"+it.id+"-"+i).then(function(u){it.fotos[i]=u}))})});
  Object.keys(fotos).forEach(function(k){jobs.push(upPhoto(fotos[k],"especie-"+k).then(function(u){fotos[k]=u}))});

var pdfBusy=false;
function svgToImg(root){
  var swaps=[];
  [].slice.call(root.querySelectorAll("svg")).forEach(function(svg){
    var r=svg.getBoundingClientRect();if(!r.width||!r.height)return;
    var cl=svg.cloneNode(true);
    var src=[svg].concat([].slice.call(svg.querySelectorAll("*"))),dst=[cl].concat([].slice.call(cl.querySelectorAll("*")));
    src.forEach(function(n,i){["fill","stroke"].forEach(function(a){var v=n.getAttribute&&n.getAttribute(a);if(v&&v.indexOf("var(")>=0){dst[i].setAttribute(a,getComputedStyle(n)[a])}});if(n.getAttribute&&n.getAttribute("class")){var cs=getComputedStyle(n);if(n.tagName==="text")dst[i].setAttribute("fill",cs.fill)}});
    cl.setAttribute("xmlns","http://www.w3.org/2000/svg");cl.setAttribute("width",Math.round(r.width));cl.setAttribute("height",Math.round(r.height));cl.removeAttribute("class");
    [].slice.call(cl.querySelectorAll(".sway,.blink")).forEach(function(n){n.removeAttribute("class")});
    var img=document.createElement("img");img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(new XMLSerializer().serializeToString(cl));
    img.style.width=r.width+"px";img.style.height=r.height+"px";img.style.display="block";
    svg.parentNode.insertBefore(img,svg);svg.style.display="none";swaps.push([svg,img]);
  });
  return function(){swaps.forEach(function(p){p[1].remove();p[0].style.display=""})};
}

function exportPDF(el,title,file){

  var ov=document.createElement("div");ov.className="pdfwait";ov.innerHTML='<div><span class="logo logo-emb" style="width:54px"></span><b>Preparando su PDF…</b><span class="note">Esto toma unos segundos.</span></div>';document.body.appendChild(ov);
  var sheet=document.createElement("div"),ph=document.createComment("pdf");sheet.className="pdfsheet";
  var restoreSvg=null;
  function restore(){if(restoreSvg){restoreSvg();restoreSvg=null}if(ph.parentNode){ph.parentNode.insertBefore(el,ph);ph.remove()}sheet.remove();ov.remove();pdfBusy=false}
  Promise.all([loadScript(LIBS.h2c),loadScript(LIBS.pdf),logoPNG("logo-emb","#373713"),logoPNG("logo-word","#373713"),logoPNG("logo-full","#373713")]).then(function(r){
    var lemb=r[2],lword=r[3],lfull=r[4];

      cuts.sort(function(a,b){return a-b});
      return window.html2canvas(sheet,{scale:2,backgroundColor:"#ffffff",useCORS:true,windowWidth:1200,logging:false}).then(function(canvas){return {canvas:canvas,cuts:cuts,lemb:lemb,lword:lword,lfull:lfull}});
    });

    var J=window.jspdf.jsPDF,doc=new J({unit:"mm",format:"a4"}),W=210,H=297,mx=12,mt=26,mb=17,cw=W-2*mx,ch=H-mt-mb;

    pages.forEach(function(pg,n){
      if(n)doc.addPage();

      doc.addImage(c.toDataURL("image/jpeg",.9),"JPEG",mx,mt,cw,h/k);
      if(o.lemb)doc.addImage(o.lemb.url,"PNG",mx,8,11,11*o.lemb.h/o.lemb.w);
      if(o.lword)doc.addImage(o.lword.url,"PNG",mx+13,10.5,30,30*o.lword.h/o.lword.w);
      doc.setTextColor(55,55,19);doc.setFont("helvetica","bold");doc.setFontSize(10);doc.text(title,W-mx,13,{align:"right",maxWidth:110});
      doc.setFont("helvetica","normal");doc.setFontSize(8);doc.setTextColor(104,96,47);doc.text(fmtDate(todayISO()),W-mx,18,{align:"right"});
      doc.setDrawColor(55,55,19);doc.setLineWidth(.6);doc.line(mx,22,W-mx,22);

    });

}

  if(editing){toast("Termina o cancela lo que estás editando");return}
  if(!ART){saveShop();return}
  var btn=$("#admSave");btn.disabled=true;$("#admStatus").textContent="Publicando…";
  ART.publish(buildDocument(draft)).then(function(){$("#admStatus").textContent="Publicado. La página se está actualizando."},function(e){
    btn.disabled=false;var c=e&&e.code;
    $("#admStatus").textContent = c==="not_writer"||c==="not_granted"||c==="consent_required" ? "Esta vista es de solo lectura: abre la página desde tu cuenta para editarla."
      : c==="too_large" ? "La página quedó muy pesada: usa menos fotos o fotos más chicas."
      : c==="conflict" ? "Alguien guardó otra versión antes; la página se va a recargar."
      : c==="rate_limited" ? "Demasiados guardados seguidos; espera un minuto."
      : "No se pudo publicar. Intenta de nuevo en un momento.";
  });
}
function openAdmin(){
  draft=JSON.parse(JSON.stringify(STATE));editing=null;pendingDel=null;renderAdmin();
  var d=$("#admin"); if(d.showModal) d.showModal(); else d.setAttribute("open","");
}

/* ---------- arranque ---------- */
function mount(){
  $("#app").innerHTML=header()+'<main>'+
    '<div data-view="tienda" id="tienda">'+hero()+toolsSection()+stockSection()+printSection()+builderSection()+contactSection()+privacySection()+'</div>'+
    '<div data-view="galeria" hidden>'+gallerySection()+'</div>'+
    '<div data-view="guias" hidden>'+guidesSection()+cmpSection()+'</div>'+
    '<div data-view="plantas" hidden>'+plantsSection()+'</div>'+
    '<div data-view="diagnostico" hidden>'+diagSection()+'</div>'+
    '<div data-view="mireptil" hidden>'+petSection()+'</div>'+
    '<div data-view="test" hidden>'+quizSection()+'</div>'+
    '</main>'+footerHTML()+bottomNav()+adminDialog()+acctDialog();
  view.quiz=newQuiz();renderStock();renderGuide();renderQuiz();renderBuilder();renderPlants();renderDiag();renderCmp();renderGal();
  if(!FROM_LINK)route(location.hash.slice(1));initSB();setupInstall();
}
mount();

document.addEventListener("click",function(e){
  var t=e.target, b;
  if(t.matches&&t.matches("img[data-cycle]")){var arr=JSON.parse(t.getAttribute("data-cycle")),ci=(+t.getAttribute("data-ci")+1)%arr.length;t.src=arr[ci];t.setAttribute("data-ci",ci);var dts=t.parentNode.querySelectorAll(".phdots i");for(var di=0;di<dts.length;di++)dts[di].className=di===ci?"on":"";return}
  if((b=t.closest("[data-filter]"))){view.filter=b.getAttribute("data-filter");renderStock();return}
  if((b=t.closest("[data-tab]"))){view.tab=b.getAttribute("data-tab");renderGuide();return}
  if((b=t.closest("[data-goto-tab]"))){view.tab=b.getAttribute("data-goto-tab");renderGuide();return}
  if((b=t.closest("[data-cfg-sp]"))){var sp=b.getAttribute("data-cfg-sp");var r=$("#sp-"+sp);if(r)r.checked=true;applySpecies(sp);return}
  if((b=t.closest("[data-ans]"))){var o=QUIZ[view.quiz.i].o[+b.getAttribute("data-ans")][1];Object.keys(o).forEach(function(k){view.quiz.score[k]+=o[k]});if(view.quiz.i<QUIZ.length-1)view.quiz.i++;else view.quiz.done=true;renderQuiz();return}
  if(t.closest("[data-quiz-reset]")){view.quiz=newQuiz();renderQuiz();return}
  if((b=t.closest("[data-copy]"))){copyText(b.getAttribute("data-copy"),"Número copiado");return}
  if(t.closest("#copyQuote")){copyText(cfgMessage(),"Resumen copiado");return}
  if(t.closest("#adminBtn")||t.closest("[data-open-admin]")){openAdmin();return}
  if(!draft) return;
  if(t.closest("#admClose")){var d=$("#admin");if(d.close)d.close();else d.removeAttribute("open");return}
  if(t.closest("#admSave")){save();return}
  if((b=t.closest("[data-additem]"))){readSettings();editing=normItem({id:"i"+Date.now().toString(36),tipo:b.getAttribute("data-additem"),estado:"disponible",cantidad:1,nombre:"",precio:"",detalle:"",fotos:[],datos:{}});editing._new=true;renderAdmin();var fm=$("#itemForm");if(fm)fm.scrollIntoView({block:"start"});return}
  if((b=t.closest("[data-admtab]"))){readSettings();if(editing)readItem();admTab=b.getAttribute("data-admtab");renderAdmin();return}
  if((b=t.closest("[data-qty]"))){readSettings();var qp=b.getAttribute("data-qty").split("|"),qi=draft.stock[+qp[0]];qi.cantidad=Math.max(0,(qi.cantidad||0)+(+qp[1]));renderAdmin();return}
  if((b=t.closest("[data-fmain]"))){readItem();var fi=+b.getAttribute("data-fmain"),fu=editing.fotos.splice(fi,1)[0];editing.fotos.unshift(fu);readSettings();renderAdmin();return}
  if((b=t.closest("[data-fdel]"))){readItem();editing.fotos.splice(+b.getAttribute("data-fdel"),1);readSettings();renderAdmin();return}
  if((b=t.closest("[data-edit]"))){readSettings();editing=normItem(JSON.parse(JSON.stringify(draft.stock[+b.getAttribute("data-edit")])));renderAdmin();var fm2=$("#itemForm");if(fm2)fm2.scrollIntoView({block:"start"});return}
  if((b=t.closest("[data-del]"))){readSettings();pendingDel=draft.stock[+b.getAttribute("data-del")].id;renderAdmin();return}
  if((b=t.closest("[data-del-yes]"))){readSettings();draft.stock.splice(+b.getAttribute("data-del-yes"),1);pendingDel=null;renderAdmin();return}
  if(t.closest("[data-del-no]")){readSettings();pendingDel=null;renderAdmin();return}
  if((b=t.closest("[data-sp-del]"))){readSettings();delete draft.settings.fotos[b.getAttribute("data-sp-del")];renderAdmin();return}
  if(t.closest("#f-cancel")){readSettings();editing=null;renderAdmin();return}
  if(t.closest("#f-ok")){
    readItem();readSettings();
    var isNew=editing._new; delete editing._new;
    if(isNew) draft.stock.unshift(editing); else draft.stock=draft.stock.map(function(x){return x.id===editing.id?editing:x});
    editing=null;renderAdmin();return;
  }
});
document.addEventListener("input",function(e){
  if(e.target.id==="alto"){view.cfg.alto=+e.target.value;$("#altoOut").textContent=view.cfg.alto+" cm";renderPreview()}
});
document.addEventListener("change",function(e){
  var t=e.target;
  if(t.name==="sp"){applySpecies(t.value);return}
  if(t.name==="base"){view.cfg.base=t.value;renderPreview();return}
  if(t.name==="style"){view.cfg.style=t.value;renderBuilder();return}
  if(t.name==="ex"){view.cfg.extras[t.value]=t.checked;renderBuilder();return}
  if(t.getAttribute&&t.getAttribute("data-sp-photo")&&t.files&&t.files[0]){var spk=t.getAttribute("data-sp-photo");readSettings();resizeImage(t.files[0],function(url){draft.settings.fotos=draft.settings.fotos||{};draft.settings.fotos[spk]=url;renderAdmin()});return}
  if(t.id==="f-foto"&&t.files&&t.files.length){readItem();var fl=[].slice.call(t.files,0,Math.max(0,4-editing.fotos.length)),left=fl.length;fl.forEach(function(file){resizeImage(file,function(url){editing.fotos.push(url);if(--left===0){readSettings();renderAdmin()}})});return}
});

/* Permisos de edición: solo quien puede publicar ve "Administrar" */
(function(){
  if(!window.claude||!window.claude.use) return;
  Promise.all([window.claude.use("artifact"),window.claude.use("user")]).then(function(r){
    ART=r[0]; var u=r[1];
    if(!ART) return;
    var check = u ? u.canEdit() : Promise.resolve(false);
    return check.then(function(ok){
      if(!ok) return;
      EDITABLE=true; $("#adminBtn").hidden=false; renderStock();
    });
  }).catch(function(){});
})();
})();
</script>
